<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invite | Регистрация</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="stars"></div>
  <main class="auth">
    <section class="panel">
      <h1>Invite</h1>
      <p class="subtitle">Создайте аккаунт и получите пробный период</p>
      <form id="registerForm" class="card single">
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Пароль
          <input type="password" name="password" required minlength="6" />
        </label>
        <button type="submit">Создать аккаунт</button>
        <p class="hint">Пробный период — <span id="trialDays">7</span> дней, далее <span id="monthlyPrice">150</span> ₽/месяц через ЮKassa.</p>
        <p class="hint">Уже есть аккаунт? <a href="/login">Войти</a></p>
      </form>
      <p id="authMessage" class="message"></p>
    </section>
  </main>
  <script src="/static/register.js"></script>
</body>
</html>
